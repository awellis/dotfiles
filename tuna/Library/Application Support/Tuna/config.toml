[hotkeys]
custom = []

    [hotkeys.app.activate]
    carbonKeyCode = 49
    carbonModifiers = 2048

    [hotkeys.app.comboMode]
    carbonKeyCode = 41
    carbonModifiers = 6912

[settings]
activationDoublePressTrigger = 'leftCommand'
comboModeModifierTrigger = 'rightCommand'
comboModeThemeStyle = 'breadcrumb'
fuzzyModeTriggerType = 'doublePress'
screenPreference = 'activeWindow'

[[catalogSettings]]
catalogIdentifier = 'com.brnbw.tuna.themes.default'

    [catalogSettings.values]
    ThemeTint = 'system'

[[catalogSettings]]
catalogIdentifier = 'tuna.prompts'

    [catalogSettings.values]
    Provider = 'apple'
